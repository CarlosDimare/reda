name: Reda Agents — Actualizar Portal

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure data directory
        run: mkdir -p data

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install.sh | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run agent — Internacionales
        run: bash scripts/agent-internacionales.sh

      - name: Run agent — Protestas AR
        run: bash scripts/agent-protestas_ar.sh

      - name: Commit and push changes
        run: |
          git config user.name "Reda Bot"
          git config user.email "bot@corresponsaldigital.ar"
          git add data/acciones.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos"
          else
            git commit -m "Actualización automática del portal (agentes)"
            git push
          fi

  deploy:
    needs: agents
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/web-terminal run build
        env:
          BASE_PATH: /reda/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/web-terminal/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
