name: Reda Agents — Actualizar Portal

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run agent — Internacionales
        run: pnpm exec opencode run --yes "
          Hoy es $(date +%Y-%m-%d). Sos un agente de monitoreo de conflictos GLOBALES.

          1. LEÉ el archivo data/acciones.json.
          2. BUSCÁ en la web acciones colectivas, protestas, huelgas, movilizaciones de HOY en todo el mundo (EXCLUYENDO Argentina).
          3. ACTUALIZÁ data/acciones.json: mantené las entradas protestas_ar, reemplazá las internacionales.
          4. CONFIRMAME cuántas acciones encontraste.

          Buscá en BBC, Reuters, Al Jazeera, AFP, Guardian, CNN.
          Cada entrada: id, seccion, pais, bandera, hora, fecha, lugar, tipoAccion, organizaciones, motivo, status, lat, lng, fuentes, createdAt, updatedAt.
        "

      - name: Run agent — Protestas AR
        run: pnpm exec opencode run --yes "
          Hoy es $(date +%Y-%m-%d). Sos un agente de monitoreo de protestas en ARGENTINA.

          1. LEÉ el archivo data/acciones.json.
          2. BUSCÁ en la web protestas, cortes de ruta, piquetes, movilizaciones, paros, huelgas de HOY en ARGENTINA.
          3. ACTUALIZÁ data/acciones.json: mantené las entradas internacionales, reemplazá las protestas_ar.
          4. CONFIRMAME cuántas acciones encontraste.

          Buscá en Clarín, Infobae, Página 12, La Nación, Ámbito.
          Cada entrada: id, seccion, pais, bandera, hora, fecha, lugar, tipoAccion, organizaciones, motivo, status, lat, lng, fuentes, createdAt, updatedAt.
        "

      - name: Commit and push changes
        run: |
          git config user.name "Reda Bot"
          git config user.email "bot@corresponsaldigital.ar"
          git add data/acciones.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos"
          else
            git commit -m "Actualización automática del portal (agentes)"
            git push
          fi

  deploy:
    needs: agents
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/web-terminal run build
        env:
          BASE_PATH: /reda/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/web-terminal/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
