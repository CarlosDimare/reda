name: Reda Agents — Actualizar Portal

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run agent — Internacionales
        run: |
          node_modules/.bin/opencode run --dangerously-skip-permissions \
            "Sos un agente de monitoreo de conflictos GLOBALES.

          1. LEE el archivo data/acciones.json
          2. BUSCA en la web acciones colectivas, protestas, huelgas, movilizaciones de HOY en todo el mundo (EXCLUYENDO Argentina)
          3. ACTUALIZA data/acciones.json: manten las entradas protestas_ar, reemplaza las internacionales
          4. INFORMA cuantas acciones encontraste

          Cada entrada del JSON debe tener: id, seccion, pais, bandera, hora, fecha, lugar, tipoAccion, organizaciones, motivo, status, lat, lng, fuentes, createdAt, updatedAt"

      - name: Run agent — Protestas AR
        run: |
          node_modules/.bin/opencode run --dangerously-skip-permissions \
            "Sos un agente de monitoreo de protestas en ARGENTINA.

          1. LEE el archivo data/acciones.json
          2. BUSCA en la web protestas, cortes de ruta, piquetes, movilizaciones, paros, huelgas de HOY en ARGENTINA
          3. ACTUALIZA data/acciones.json: manten las entradas internacionales, reemplaza las protestas_ar
          4. INFORMA cuantas acciones encontraste

          Cada entrada del JSON debe tener: id, seccion, pais, bandera, hora, fecha, lugar, tipoAccion, organizaciones, motivo, status, lat, lng, fuentes, createdAt, updatedAt"

      - name: Commit and push changes
        run: |
          git config user.name "Reda Bot"
          git config user.email "bot@corresponsaldigital.ar"
          git add data/acciones.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos"
          else
            git commit -m "Actualizacion automatica del portal (agentes)"
            git push
          fi

  deploy:
    needs: agents
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/web-terminal run build
        env:
          BASE_PATH: /reda/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/web-terminal/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
